<!DOCTYPE html>
<html lang="en">

<head>
    <title>Convert String to Uppercase</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Young Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Great Vibes' rel='stylesheet'>
</head>

<style>
    body {
        background: url("{{url_for('static', filename='workbg.png')}}") no-repeat center center fixed;
        background-size: cover;
        margin: 0;
    }

    .nav {
        background: #ffffff71;
        position: fixed;
        width: 100%;
        text-align: right;
        top: 10px;
    }

    .nav a {
        color: #808080;
        text-decoration: none;
        text-transform: uppercase;
        font-weight: bold;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        margin: 15px;
        margin-left: 40px;
        display: inline-block;
        position: relative;
        transition: color 0.4s;
    }

    .nav a:hover {
        color: #000000;
    }

    .content-container {
        align-items: center;
        justify-content: center;
        margin-top: 110px;
    }

    h1 {
        font-family: 'Youngest Serif';
        text-align: center; 
        font-size: 90px;
        color: white;
        text-shadow: 0 0 10px rgba(141, 139, 139, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7);
    }

    h1 span {
        font-family: 'Great Vibes';
        font-size: 100px;
        color: white;
    }

    .container {
        width: 65%;
        margin: auto;
        background-color: #fffbed6b;
        padding: 50px 50px 200px 50px;
        box-shadow: 0px 0px 15px 0px rgba(0,0,0,0.2);
    }

    label {
        font-family: 'Franklin Gothic Medium', sans-serif;
        font-size: 1.5vw;
        color: #6daed5; 
        text-shadow: 0 0 12px rgba(255, 255, 255, 0.9);
        display: block;
        margin-bottom: 10px;
    }

    .body input[type=text] {
        font-size: 1.2vw;
        width: 100%;
        padding: 10px;
        box-sizing: border-box;
        border: 2px solid #f09ce1;
        border-radius: 5px;
    }

    .body input[type=submit] {
        font-size: 1.5vw;
        width: 100%;
        margin-top: 10px;
        padding: 10px;
        border: none;
        border-radius: 25px;
        background-color: #f09ce1;
        color: #FFFBED;
        cursor: pointer;
        transition: background-color 0.6s ease, transform 0.3s ease;
    }

    .body input[type=submit]:hover {
        background-color: #808080;
        transform: scale(1.05);
    }

    .result {
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        font-size: 1.6vw;
        width: 60%;
        height: auto;
        display: block;
        position: absolute;
        margin: 20px auto;
        padding: 5px 25px;
        text-align: left;
        color: #FFFBED;
        background-color: #a3d6f17c;
        border: 1px solid #3c7db1;
        border-radius: 15px;
        text-shadow: -1px -1px 1px rgba(21, 7, 7, 0.1), 1px 1px 1px rgba(0, 0, 0, .5);
        top: 75%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .description {
        color: rgb(81, 74, 74);
        font-family: 'Youngest Serif';
        text-align: center;
        margin-left: 160px;
        margin-right: 160px;
        margin-top: -60px;
        font-size: 25px;
    }

</style>

<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>

    <div class="content-container">
        <h1><span>C</span>onvert <span>S</span>tring to <span>U</span>ppercase</h1>    
        <p class="description">Enter a string you'd like to convert to uppercase ♥</p>
    </div>
    
    <div class="container">
        <form action="/touppercase" method="post">
            <label for="inputString" class="text">Enter a string:</label>
            <div class="body input">
                <input type="text" id="inputString" name="inputString" placeholder="Type your string here">
                <input type="submit" value="Convert">
            </div>
        </form>
    </div>

        <div class="result">
            {% if result %}
            <p> <span style="color: #faa1d6;">Converted string:</span> {{ result }} </p>
            {% else %}
            <p>Enter a string to see the result.</p>
            {% endif %}
        </div>
</body>

</html>
