<!DOCTYPE html>
<html lang="en">

<head>
    <title>Profile</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Youngest Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Great Vibes' rel='stylesheet'>
</head>

<style>
    body {
        background: url("{{url_for('static', filename='profilebg.png')}}") no-repeat center center fixed;
        background-size: cover;
        margin: 0;
    }

    .nav {
        background: #ffffff71;
        position: fixed;
        width: 100%;
        text-align: right;
        top: 10px;
    }

    .nav a {
        color: #808080;
        text-decoration: none;
        text-transform: uppercase;
        font-weight: bold;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        margin: 15px;
        margin-left: 40px;
        display: inline-block;
        position: relative;
        transition: color 0.4s;
    }

    .nav a:hover {
        color: #000000;
    }

    .button-container {
        position: fixed;
        bottom: 14%;
        right: 10%;
    }

    .button {
        display: inline-block;
        border-radius: 50px;
        background-color: #F082AC;
        border: none;
        color: #FFFFFF;
        text-align: center;
        font-size: 26px;
        padding: 15px;
        width: 200px;
        transition: all 0.5s;
        cursor: pointer;
        margin: 5px;
        position: relative; 
    }

    .button span {
        cursor: pointer;
        display: inline-block;
        position: relative;
        transition: 0.5s;
    }

    .button span:after {
        content: '\00bb';
        position: absolute;
        opacity: 0;
        top: 50%;
        right: -20px;
        transform: translateY(-50%);
        transition: 0.5s;
    }

    .button:hover {
        background-color: #d25180;
    }

    .button:hover span {
        padding-right: 25px;
    }

    .button:hover span:after {
        opacity: 1;
        right: 0;
    }

    .content-container {
        text-align: left;
        margin-top: 80px;
        margin-left: 700px;
    }

    h1 {
        font-family: 'Youngest Serif';
        text-align: center; 
        font-size: 60px;
        color: white;
        text-shadow: 0 0 10px rgba(141, 139, 139, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7);
    }

    h1 span {
        font-family: 'Great Vibes';
        font-size: 80px;
        color: white;
    }

    p {
        font-family: 'Lora', serif;
        font-size: 20px;
        color: white;
        text-shadow: 0 0 10px rgba(141, 139, 139, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7);
        position: relative;
        margin-top: 5px;
    }

    p::after {
        content: "";
        position: absolute;
        width: 80%;
        height: 1px;
        background-color: white;
        bottom: 0;
        left: 0;
        margin-top: 5px; 
    }

    p span {
        font-family: 'Merriweather', serif;
        font-size: 25px;
        color: white;
        display: block;
    }

</style>

<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>
    
    <div class="content-container">
        <h1 style="margin-right: 240px;"><span>A</span>bout <span>R</span>ebekah...</h1>
        <div style="margin-top: -40px;">
            <p>Full Name: 
                <span>Rebekah Joy E. Sevial</span></p>
            <p> Course: 
                <span>Bachelor of Science in Computer Engineering </span>
            </p>
            <p>Section:
                <span>BSCPE 2-4</span>
            </p>
            <p>Subject for:
                <span>Data Structures and Algorithms</span>
            </p>
            <p>School:
                <span>Polytechnic University of the Philippines</span>
            </p>
        </div>
    </div>

    <div class="button-container">
        <a href="/profilemore">
            <button class="button" style="vertical-align:middle"><span>Read More </span></button>
        </a>
    </div>
</body>
</html>
