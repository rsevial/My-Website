<!DOCTYPE html>
<html lang="en">

<head>
    <title>Works</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://fonts.googleapis.com/css?family=Youngest Serif' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Great Vibes' rel='stylesheet'>
</head>
<style>
    body {
        background: url("{{url_for('static', filename='worksbg.png')}}") no-repeat center center fixed;
        background-size: cover;
        margin: 0;
    }

    .nav {
        background: #ffffff71;
        top: 8px;
        position: fixed;
        width: 100%;
        text-align: right;
    }

    .nav a {
        color: #808080;
        text-decoration: none;
        text-transform: uppercase;
        font-weight: bold;
        font-family: 'Trebuchet MS', Arial, sans-serif;
        margin: 15px;
        margin-left: 40px;
        display: inline-block;
        position: relative;
        transition: color 0.4s;
    }

    .nav a:hover {
        color: #000000;
    }

    .content-container {
        align-items: center;
        justify-content: center;
        margin-top: 80px;
        margin-bottom: 80px;
    }

    h1 {
        font-family: 'Youngest Serif';
        text-align: center; 
        font-size: 80px;
        color: white;
        text-shadow: 0 0 10px rgba(141, 139, 139, 0.7), 0 0 20px rgba(255, 255, 255, 0.7), 0 0 30px rgba(255, 255, 255, 0.7);
    }

    h1 span {
        font-family: 'Great Vibes';
        font-size: 90px;
        color: white;
    }

    .img {
        width: 250px;
    }

    .img-hover {
        display: none;
        width: 250px;
    }

    .button-container {
        display: flex;
        justify-content: center;
        align-items: flex-end; 
        margin-top: 4%;
    }

    .button {
        border: none;
        cursor: pointer;
        appearance: none;
        background-color: inherit;
        transition: transform .3s ease-in-out; 
        position: relative;
    }

    .button:hover {
        transform: scale(1.05);
    }

    .button:hover .img {
        display: none;
    }

    .button:hover .img-hover {
        display: block;
    }

    .description {
        color: rgb(81, 74, 74);
        font-family: 'Youngest Serif';
        text-align: center;
        margin-left: 160px;
        margin-right: 160px;
        margin-top: -50px;
        font-size: 25px;
    }

</style>

<body>
    <div class="nav">
        <a href="/">Home</a>
        <a href="/profile">Profile</a>
        <a href="/works">Works</a>
        <a href="/contact">Contact</a>
    </div>
    
    <div class="content-container">
        <h1><span>P</span>rogramming <span>W</span>orks</h1>
        <p class="description">Choose the laboratory you'd like to explore ♥</p>
    </div>

    <div class="button-container">
        <a href="/touppercase">
            <button type="touppercase" class="button" style="rotate: 356deg;">
                <img src="static/1.png" alt="buttonpng" border="0" class="img" />
                <img src="static/11.png" alt="buttonpng" border="0" class="img-hover" />
            </button>
        </a>

        <a href="/circle">
            <button type="circle" class="button" style="rotate: 2deg;">
                <img src="static/2.png" alt="buttonpng" border="0" class="img" />
                <img src="static/22.png" alt="buttonpng" border="0" class="img-hover" />
            </button>
        </a>

        <a href="/triangle">
            <button type="triangle" class="button" style="rotate: 356deg;">
                <img src="static/3.png" alt="buttonpng" border="0" class="img" />
                <img src="static/33.png" alt="buttonpng" border="0" class="img-hover" />
            </button>
        </a>

        <a href="/mergelist">
            <button type="mergelist" class="button" style="rotate: 3deg;">
                <img src="static/4.png" alt="buttonpng" border="0" class="img" />
                <img src="static/44.png" alt="buttonpng" border="0" class="img-hover" />
            </button>
        </a>

    </div>
</body>
</html>
